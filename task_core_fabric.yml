---
- name: Core - Ensure the Target Tenant Exists
  cisco.aci.aci_tenant:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    state: present

- name: Core - Ensure the Target VRFs Exist (De-duplicated)
  cisco.aci.aci_vrf:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    vrf: "{{ item }}"
    state: present
  loop: "{{ vlan_migration_list | map(attribute='vrf_name') | unique | list }}"

- name: Core - Validate that EPGs sharing a bridge domain use one VRF
  ansible.builtin.assert:
    that:
      - (vlan_migration_list | selectattr('bd_name', 'equalto', item) | map(attribute='vrf_name') | unique | list | length) == 1
    fail_msg: "EPGs sharing bridge domain {{ item }} specify different VRFs."
  loop: "{{ vlan_migration_list | selectattr('bd_name', 'defined') | map(attribute='bd_name') | unique | list }}"
  loop_control:
    label: "{{ item }}"

- name: Core - Validate bridge-domain definitions are unique
  ansible.builtin.assert:
    that:
      - bridge_domains | map(attribute='bd_name') | list | length == bridge_domains | map(attribute='bd_name') | unique | list | length
    fail_msg: "bridge_domains must contain exactly one definition per bd_name."
  when: bridge_domains is defined

- name: Core - Validate EPG bridge-domain references and VRFs
  ansible.builtin.assert:
    that:
      - item.bd_name in (bridge_domains | map(attribute='bd_name') | list)
      - item.vrf_name == (bridge_domains | selectattr('bd_name', 'equalto', item.bd_name) | map(attribute='vrf_name') | first)
    fail_msg: "EPG {{ item.epg_name }} must reference a defined bridge domain with the same VRF."
  loop: "{{ vlan_migration_list }}"
  loop_control:
    label: "{{ item.epg_name }}"
  when: bridge_domains is defined

- name: Core - Build Bridge Domains from matrix definitions
  cisco.aci.aci_bd:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    bd: "{{ item.bd_name }}"
    vrf: "{{ item.vrf_name }}"
    enable_routing: "{{ item.enable_routing | default(false, true) }}"
    l2_unknown_unicast: "{{ item.l2_unknown_unicast | default('flood', true) }}"
    arp_flooding: "{{ item.arp_flooding | default(true, true) }}"
    state: present
  loop: "{{ bridge_domains | default(vlan_migration_list | unique(attribute='bd_name') | list, true) }}"
  loop_control:
    label: "{{ item.bd_name }} -> VRF: {{ item.vrf_name }}"

- name: Core - Ensure Application Profiles Exist (De-duplicated)
  cisco.aci.aci_ap:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    ap: "{{ item }}"
    state: present
  loop: "{{ vlan_migration_list | map(attribute='ap_name') | unique | list }}"

- name: Core - Create EPGs for each Extended VLAN under mapped AP
  cisco.aci.aci_epg:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    ap: "{{ item.ap_name }}"
    epg: "{{ item.epg_name }}"
    bd: "{{ item.bd_name }}"
    state: present
  loop: "{{ vlan_migration_list }}"
  loop_control:
    label: "Tenant: {{ tenant_name }} -> AP: {{ item.ap_name }} -> {{ item.epg_name }}"

