---
- name: Core - Ensure the Target Tenant Exists
  cisco.aci.aci_tenant:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    description: "Multi-Tenant Migration Managed via Ansible Matrix"
    state: present

- name: Core - Ensure the Target VRFs Exist (De-duplicated)
  cisco.aci.aci_vrf:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    vrf: "{{ item }}"
    state: present
  loop: "{{ vlan_migration_list | map(attribute='vrf_name') | unique | list }}"

- name: Core - Build L2-Optimized Bridge Domains
  cisco.aci.aci_bd:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    bd: "BD-{{ item.epg_name }}"
    vrf: "{{ item.vrf_name }}"
    enable_routing: no
    l2_unknown_unicast: flood
    arp_flooding: yes
    state: present
  loop: "{{ vlan_migration_list }}"
  loop_control:
    label: "BD-{{ item.epg_name }} -> VRF: {{ item.vrf_name }}"

- name: Core - Ensure Application Profiles Exist (De-duplicated)
  cisco.aci.aci_ap:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    ap: "{{ item }}"
    state: present
  loop: "{{ vlan_migration_list | map(attribute='ap_name') | unique | list }}"

- name: Core - Create EPGs for each Extended VLAN under mapped AP
  cisco.aci.aci_epg:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    ap: "{{ item.ap_name }}"
    epg: "EPG-{{ item.epg_name }}"
    bd: "BD-{{ item.epg_name }}"
    state: present
  loop: "{{ vlan_migration_list }}"
  loop_control:
    label: "Tenant: {{ tenant_name }} -> AP: {{ item.ap_name }} -> EPG-{{ item.epg_name }}"

