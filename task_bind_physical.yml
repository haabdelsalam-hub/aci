---
- name: Physical - Dynamically Link EPGs to Multiple Physical Domains
  cisco.aci.aci_epg_to_domain:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    ap: "{{ item.0.ap_name }}"
    epg: "EPG_VLAN_{{ item.0.vlan_id }}"
    domain: "{{ item.1 }}"              # Dynamically picks up the bare-metal / switch domain name
    domain_type: phys                   # Specifies Physical Domain infrastructure mapping
    state: present
  loop: "{{ vlan_migration_list | subelements('physical_domains', skip_missing=True) }}"
  loop_control:
    label: "Tenant: {{ tenant_name }} -> EPG_VLAN_{{ item.0.vlan_id }} bound to PhysDom: {{ item.1 }}"

