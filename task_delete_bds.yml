---
- name: Load targeted BD deletion matrix file dynamically per environment
  ansible.builtin.include_vars:
    file: "delete_bd_{{ env | default('prod') }}_matrix.yml"

- name: Teardown - Remove Targeted Bridge Domains
  cisco.aci.aci_bd:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    bd: "{{ item }}"
    state: absent
  loop: "{{ delete_bds_list | default([]) }}"
  loop_control:
    label: "Tenant: {{ tenant_name }} -> Deleting BD: {{ item }}"
  when: delete_bds_list is defined and delete_bds_list | length > 0

