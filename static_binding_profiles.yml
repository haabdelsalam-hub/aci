---
# Reusable sets of physical path bindings. Encapsulation is supplied by each
# EPG's static_binding_encap_id unless a profile entry overrides it.
static_binding_profiles:
  six_server_vpcs:
    - deploy_immediacy: immediate
      interface_mode: trunk
      interface_type: vpc
      pod_id: 1
      leafs: ['101', '102']
      interface: Server01_VPC
      description: Server 1 trunk on eth1/8 of both leaves
      state: present
    - deploy_immediacy: immediate
      interface_mode: trunk
      interface_type: vpc
      pod_id: 1
      leafs: ['101', '102']
      interface: Server02_VPC
      description: Server 2 trunk on eth1/9 of both leaves
      state: present
    - deploy_immediacy: immediate
      interface_mode: trunk
      interface_type: vpc
      pod_id: 1
      leafs: ['101', '102']
      interface: Server03_VPC
      description: Server 3 trunk on eth1/3 of both leaves
      state: present
    - deploy_immediacy: immediate
      interface_mode: trunk
      interface_type: vpc
      pod_id: 1
      leafs: ['101', '102']
      interface: Server04_VPC
      description: Server 4 trunk on eth1/4 of both leaves
      state: present
    - deploy_immediacy: immediate
      interface_mode: trunk
      interface_type: vpc
      pod_id: 1
      leafs: ['101', '102']
      interface: Server05_VPC
      description: Server 5 trunk on eth1/5 of both leaves
      state: present
    - deploy_immediacy: immediate
      interface_mode: trunk
      interface_type: vpc
      pod_id: 1
      leafs: ['101', '102']
      interface: Server06_VPC
      description: Server 6 trunk on eth1/6 of both leaves
      state: present

  dmz_cluster_vpc:
    - deploy_immediacy: immediate
      interface_mode: trunk
      interface_type: vpc
      pod_id: 1
      leafs: ['101', '102']
      interface: LINTVPCPG_101-102-CLS1Nod01
      state: present

  baremetal_vpc_access:
    - deploy_immediacy: immediate
      interface_mode: access
      interface_type: vpc
      pod_id: 1
      leafs: ['101', '102']
      interface: BareMetal_VPC_Port10
      description: Bare metal access VLAN; eth1/10 on leaves 101 and 102
      state: present

  baremetal_single_port_access:
    - deploy_immediacy: immediate
      interface_mode: access
      interface_type: switch_port
      pod_id: 1
      leafs: '101'
      interface: 1/11
      description: Bare metal access VLAN; single port eth1/11 on leaf 101
      state: present
