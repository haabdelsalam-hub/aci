---
- name: Nutanix - Dynamically Link EPGs to Multiple Nutanix VMM Domains
  cisco.aci.aci_epg_to_domain:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    ap: "{{ item.0.ap_name }}"
    epg: "{{ item.0.epg_object_name | default('EPG-' ~ item.0.epg_name) }}"
    domain: "Nutanix-{{ item.1 }}"       # <--- FIX: Prepends the implicit APIC provider name string
    domain_type: vmm
    vm_provider: nutanix
    resolution_immediacy: pre-provision
    state: present
  loop: "{{ vlan_migration_list | subelements('nutanix_domains', skip_missing=True) }}"
  loop_control:
    label: "Nutanix Link -> {{ tenant_name }} -> {{ item.0.epg_object_name | default('EPG-' ~ item.0.epg_name) }} to VMM: Nutanix-{{ item.1 }}"

