---
- name: Report - Initialize tenant CSV report
  ansible.builtin.copy:
    content: "EPG_ID,Encap_ID,Network_Name,Tenant,App_Profile,VRF_Name,BD_Routing_Disabled,VMware_VMM_Bound,Nutanix_VMM_Bound,Physical_Bound,Static_Path_Bound\n"
    dest: "./aci_report_{{ tenant_name }}.csv"
    mode: '0644'

- name: Report - Query EPG domain and static path attachments
  cisco.aci.aci_rest:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    path: "/api/node/mo/uni/tn-{{ tenant_name }}/ap-{{ item.ap_name }}/epg-EPG-{{ item.epg_name }}.json?query-target=children"
    method: get
  register: epg_attachment_status
  loop: "{{ vlan_migration_list }}"
  loop_control:
    label: "EPG-{{ item.epg_name }}"

- name: Report - Append EPG status to CSV
  ansible.builtin.lineinfile:
    path: "./aci_report_{{ tenant_name }}.csv"
    line: >-
      EPG-{{ item.item.epg_name }},{{ item.item.encap_id }},{{ item.item.name }},{{ tenant_name }},{{ item.item.ap_name }},{{ item.item.vrf_name }},Yes,{{ 'Yes' if 'vmmp-VMware' in item.imdata | string else 'No' }},{{ 'Yes' if 'vmmp-Nutanix' in item.imdata | string else 'No' }},{{ 'Yes' if 'phys-' in item.imdata | string else 'No' }},{{ 'Yes' if 'fvRsPathAtt' in item.imdata | string else 'No' }}
  loop: "{{ epg_attachment_status.results }}"
  loop_control:
    label: "EPG-{{ item.item.epg_name }}"
