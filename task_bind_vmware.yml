---
- name: VMware - Dynamically Link EPGs to Multiple VMware VMM Domains
  cisco.aci.aci_epg_to_domain:
    host: "{{ apic_login.host }}"
    username: "{{ apic_login.username }}"
    password: "{{ apic_login.password }}"
    use_ssl: "{{ apic_login.use_ssl }}"
    validate_certs: "{{ apic_login.validate_certs }}"
    tenant: "{{ tenant_name }}"
    ap: "{{ item.0.ap_name }}"
    epg: "{{ item.0.epg_name }}"
    domain: "{{ item.1 }}"        # <--- FIX: Prepends the implicit APIC provider name string
    domain_type: vmm
    vm_provider: vmware
    state: present
  loop: "{{ (vlan_migration_list | default([])) | subelements('vmware_domains', skip_missing=True) }}"
  loop_control:
    label: "VMware Link -> {{ tenant_name }} -> {{ item.0.epg_name }} to VMM: {{ item.1 }}"

